<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CybrStudy — Your Study Material Hub</title>
    <meta name="description" content="Access, preview, and download curated study materials. Organized by subject and semester." />

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <!-- Direct SPA path redirect to hash routing -->
    <script>
      (function() {
        var pathname = window.location.pathname;
        var hash = window.location.hash;
        if (!hash || hash === '#' || hash === '#/') {
          var clean = pathname.replace(/\/cybrstudy\/?/i, '').replace(/^\/+/, '').replace(/\/+$/, '');
          if (clean === 'login' || clean === 'admin' || clean === 'admin-portal-xyz') {
            var base = pathname.toLowerCase().indexOf('/cybrstudy') !== -1 ? '/CybrStudy/' : '/';
            window.location.replace(base + '#/login' + window.location.search);
          } else if (clean.indexOf('browse') === 0) {
            var base = pathname.toLowerCase().indexOf('/cybrstudy') !== -1 ? '/CybrStudy/' : '/';
            window.location.replace(base + '#/' + clean + window.location.search);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
