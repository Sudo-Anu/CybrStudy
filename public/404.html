<!-- GitHub Pages SPA Fallback
     This file handles direct URL access (404s) for hash-based routing.
     React Router uses HashRouter, so this is a safety net only.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CybrStudy</title>
    <script>
      // GitHub Pages SPA Fallback
      var pathname = window.location.pathname;
      var clean = pathname.replace(/\/cybrstudy\/?/i, '').replace(/^\/+/, '').replace(/\/+$/, '');
      var base = pathname.toLowerCase().indexOf('/cybrstudy') !== -1 ? '/CybrStudy/' : '/';
      if (clean === 'admin' || clean === 'admin-portal-xyz') {
        clean = 'login';
      }
      window.location.replace(base + '#/' + clean + window.location.search);
    </script>
  </head>
  <body></body>
</html>
