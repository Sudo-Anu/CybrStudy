<!-- GitHub Pages SPA Fallback
     This file handles direct URL access (404s) for hash-based routing.
     React Router uses HashRouter, so this is a safety net only.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CybrStudy</title>
    <script>
      // Redirect to root with the path preserved as a hash
      const path = window.location.pathname
        .replace('/CybrStudy', '')
        .replace(/^\//, '');
      window.location.replace('/CybrStudy/#/' + path + window.location.search);
    </script>
  </head>
  <body></body>
</html>
